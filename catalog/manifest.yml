# Template for https://github.com/flipperdevices/flipper-application-catalog
# 1. Fork the catalog, branch its-sven/vaultflipper_<fap_version> (e.g. its-sven/vaultflipper_0.1).
# 2. Copy this file to applications/Tools/vaultflipper/manifest.yml and set
#    commit_sha to the full 40-character SHA of the pushed release commit.
# 3. Validate: python3 tools/bundle.py --nolint applications/Tools/vaultflipper/manifest.yml bundle.zip
# Screenshots must be 512x256 (4x) with pure black pixels; tools/flipctl.py saves them that way.
# Every update needs a higher fap_version in flipper/vaultflipper/application.fam.
sourcecode:
  type: git
  location:
    origin: https://github.com/its-sven/vaultflipper.git
    commit_sha: 0000000000000000000000000000000000000000
    subdir: flipper/vaultflipper
description: "@./docs/README.md"
changelog: "@./docs/changelog.md"
author: "@its-sven"
screenshots:
  - "./docs/screenshots/2-home.png"
  - "./docs/screenshots/4-entries.png"
  - "./docs/screenshots/5-card.png"
  - "./docs/screenshots/8-codes.png"
  - "./docs/screenshots/9-code.png"
  - "./docs/screenshots/7-settings.png"
  - "./docs/screenshots/1-pin.png"
