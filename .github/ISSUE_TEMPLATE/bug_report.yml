name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please never paste passwords, vault files or exports. Use made-up data.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Flipper firmware
      placeholder: e.g. official 1.5.1
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: VaultFlipper app and companion version
      placeholder: e.g. app 0.1.0 (About screen), companion 0.1.0 (vaultflipper --version)
  - type: input
    id: host
    attributes:
      label: Computer and keyboard layout
      placeholder: e.g. macOS 26, German; Windows 11, en-US
